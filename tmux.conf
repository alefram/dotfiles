set -ga terminal-overrides ",xterm-256color:Tc"

set -g mouse on
set -g mode-keys vi
set -g set-clipboard on
set -g history-limit 50000

set -g base-index 1
set -g pane-base-index 1
set -g escape-time 0
set -g focus-events on

set -g prefix C-b
unbind C-b
bind C-b send-prefix

bind F4 split-window -c '#{pane_current_path}'
bind F5 split-window -h -c '#{pane_current_path}'
bind F6 split-window -v -c '#{pane_current_path}'
bind F7 rotate-window

bind T new-window -c '#{pane_current_path}'

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind Home select-layout -E

# Clipboard integration (system clipboard via xclip/xsel)
if -b '[ -n "$(which xclip)" ]' {
    bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
    bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
    bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
} {
    bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xsel --clipboard --input"
    bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xsel --clipboard --input"
    bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xsel --clipboard --input"
}
